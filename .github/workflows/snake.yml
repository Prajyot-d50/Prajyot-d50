name: Generate GitHub Snake

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_dots=#ebedf0,#c6e48b,#7bc96f,#239a3b,#196127
            dist/github-snake-dark.svg?palette=github-dark&color_dots=#30363d,#3fb950,#26a641,#2ea043,#238636
            dist/ocean.gif?color_dots=#d0d7de,#b6e3ff,#79c0ff,#409eff,#1f6feb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation"
          commit_message: "Update snake animation"
