name: Generate GitHub Snake

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_dots=%23ebedf0,%23c6e48b,%237bc96f,%23239a3b,%23196127
            dist/github-snake-dark.svg?palette=github-dark&color_dots=%2330363d,%233fb950,%2326a641,%232ea043,%23238636
            dist/ocean.gif?color_dots=%23d0d7de,%23b6e3ff,%2379c0ff,%23409eff,%231f6feb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation"
